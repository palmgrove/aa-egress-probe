name: aa-egress-probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: runner-ip
        run: |
          echo "runner-ip: $(curl -s --max-time 15 https://api.ipify.org)"
          echo "runner-ip2: $(curl -s --max-time 15 https://ifconfig.me)"
      - name: targets
        run: |
          for u in \
            https://git.workos.cloud/ \
            https://workos.cloud/ \
            https://api.workos.cloud/github-actions \
            https://api.workos.cloud/v1/ping \
            https://api.workos.site/v1/runtime/secrets \
            https://mcp.workos.cloud/mcp \
            https://corp.workos.site/ \
            https://drop.workos.site/ \
            https://usercontent.workos.site/ \
            https://gateway-dev.workos.site/ \
            https://saas-fallback.workos.site/ \
            https://signin.workos.site/ \
            https://cli.workos.cloud/ \
            https://example.com/ ; do
            out=$(curl -sS -o /tmp/b -w '%{http_code} %{size_download}' --max-time 25 "$u" 2>/tmp/e || true)
            echo "=== $u -> $out"
            echo "sha: $(sha256sum /tmp/b 2>/dev/null | cut -d' ' -f1)"
            echo "head: $(head -c 120 /tmp/b 2>/dev/null | tr '\n' ' ')"
          done
